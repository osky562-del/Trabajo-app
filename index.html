<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora Pro - Furgo-Trayler</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        :root {
            --dia-color: #FFD700; --noche-color: #4B0082; --fuera-color: #FF4500; 
            --domingo-color: #27ae60; --accent: #2c3e50; --bg: #f4f4f9;
        }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg); padding-bottom: 80px; }
        #app { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; }

        /* NUEVO HEADER CON LOGO */
        header { 
            padding: 10px; 
            text-align: center; 
            background: white; /* Cambiado a blanco para que resalte el logo */
            position: sticky; 
            top:0; 
            z-index:100; 
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px; /* Altura fija para el logo */
        }
        
        /* ESTILO DEL LOGO */
        .logo-header {
            max-height: 100%; /* Ocupa la altura del header sin deformarse */
            max-width: 80%;   /* Evita que se salga por los lados */
            object-fit: contain; /* Mantiene las proporciones */
        }
        
        .tab-content { display: none; padding: 10px; }
        .tab-content.active { display: block; }

        /* Panel Superior */
        .panel-dietas { background: #e8f5e9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #c8e6c9; }
        .stats { display: flex; justify-content: space-around; font-weight: bold; font-size: 14px; }

        /* Formulario en Calendario */
        .form-contenedor { background: #fff; border: 2px solid var(--accent); border-radius: 12px; padding: 15px; margin-top: 10px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; }
        label { font-size: 10px; color: #666; font-weight: bold; text-transform: uppercase; }

        /* Pestaña Rutas (Ajustes) */
        .ruta-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; align-items: center; }
        .btn-add { background: var(--domingo-color); color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-del { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 10px; }

        /* Historial */
        .card { background: white; border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid var(--accent); }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; font-size: 13px; }

        /* Navegación */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-btn { background: none; border: none; color: #999; font-size: 10px; font-weight: bold; }
        .nav-btn.active { color: var(--accent); }
        .nav-btn i { display: block; font-size: 20px; margin-bottom: 4px; }

        .btn-turno { border: none; padding: 10px; border-radius: 6px; color: white; font-weight: bold; font-size: 11px; opacity: 0.4; }
        .btn-turno.selected { opacity: 1; transform: scale(1.05); border: 2px solid black; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <img src="URL_DE_TU_LOGO_EN_GITHUB" alt="Furgo-Trayler" class="logo-header">
    </header>

    <div id="tab-cal" class="tab-content active">
        <div class="panel-dietas">
            <div class="stats">
                <span>☀️ <span id="c-dia">0</span></span>
                <span>🌙 <span id="c-noche">0</span></span>
                <span>🏨 <span id="c-fuera">0</span></span>
                <span style="color:var(--domingo-color)">€ <span id="c-euros">0</span></span>
            </div>
        </div>
        <div id="calendar"></div>
        
        <div id="form-dia" class="form-contenedor">
            <b id="fecha-label"></b>
            <div style="display:flex; gap:5px; margin: 10px 0;">
                <button id="b-dia" class="btn-turno" style="background:var(--dia-color);color:black" onclick="selT('dia')">DÍA</button>
                <button id="b-noche" class="btn-turno" style="background:var(--noche-color)" onclick="selT('noche')">NOCHE</button>
                <button id="b-fuera" class="btn-turno" style="background:var(--fuera-color)" onclick="selT('fuera')">FUERA</button>
                <button class="btn-turno" style="background:#888; opacity:1" onclick="borrar()">BORRAR</button>
            </div>
            
            <label>Ruta Predeterminada</label>
            <select id="sel-ruta"><option value="">-- Selecciona Ruta --</option></select>
            
            <div class="form-grid">
                <div><label>Tractora 1</label><input type="text" id="t1"></div>
                <div><label>Tractora 2</label><input type="text" id="t2"></div>
                <div><label>Remolque 1</label><input type="text" id="r1"></div>
                <div><label>Remolque 2</label><input type="text" id="r2"></div>
            </div>
            <button class="btn-add" onclick="guardar()">CONFIRMAR DÍA</button>
        </div>
    </div>

    <div id="tab-list" class="tab-content">
        <h3>Historial de Viajes</h3>
        <div id="historial-lista"></div>
    </div>

    <div id="tab-conf" class="tab-content">
        <h3>Gestionar mis Rutas</h3>
        <p style="font-size:12px; color:#666">Añade aquí las rutas que haces siempre para no escribirlas.</p>
        <div style="display:flex; gap:5px;">
            <input type="text" id="nueva-ruta-input" placeholder="Ej: Madrid-Valencia">
            <button onclick="addRutaLista()" style="background:var(--accent); color:white; border:none; padding:10px; border-radius:6px;">+</button>
        </div>
        <div id="lista-rutas-config" style="margin-top:20px;"></div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="nav('cal')">📅<br>CALENDARIO</button>
        <button class="nav-btn" onclick="nav('list')">📋<br>LISTADO</button>
        <button class="nav-btn" onclick="nav('conf')">⚙️<br>RUTAS</button>
    </nav>
</div>

<script>
    let cal;
    let currF = null, currT = null;
    let datos = JSON.parse(localStorage.getItem('truck_pro_v2')) || [];
    let misRutas = JSON.parse(localStorage.getItem('rutas_frecuentes')) || ['Ruta Local', 'Base-Base'];

    document.addEventListener('DOMContentLoaded', () => {
        cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth', locale: 'es', firstDay: 1, height: 'auto',
            headerToolbar: { left: 'prev,next', center: 'title', right: '' },
            events: datos,
            dateClick: (i) => { currF = i.dateStr; mostrarForm(i.dateStr); },
            datesSet: actualizarTodo
        });
        cal.render();
        pintarRutasConfig();
        actualizarSelectRutas();
    });

    function nav(t) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        event.currentTarget.classList.add('active');
        if(t === 'cal') cal.render();
        if(t === 'list') pintarHistorial();
    }

    function mostrarForm(f) {
        document.getElementById('form-dia').style.display = 'block';
        document.getElementById('fecha-label').innerText = "Día: " + f;
        const ex = datos.find(e => e.start === f);
        if(ex) {
            selT(ex.extendedProps.tipo);
            document.getElementById('t1').value = ex.extendedProps.t1;
            document.getElementById('t2').value = ex.extendedProps.t2;
            document.getElementById('r1').value = ex.extendedProps.r1;
            document.getElementById('r2').value = ex.extendedProps.r2;
            document.getElementById('sel-ruta').value = ex.extendedProps.ruta || '';
        } else {
            selT(null);
            document.querySelectorAll('#form-dia input').forEach(i => i.value = '');
            document.getElementById('sel-ruta').value = '';
        }
    }

    function selT(t) {
        currT = t;
        document.querySelectorAll('.btn-turno').forEach(b => b.classList.remove('selected'));
        if(t) document.getElementById('b-'+t).classList.add('selected');
    }

    function guardar() {
        if(!currT) return alert("Selecciona turno");
        datos = datos.filter(e => e.start !== currF);
        const col = {dia:'var(--dia-color)', noche:'var(--noche-color)', fuera:'var(--fuera-color)'};
        const txt = {dia:'☀️ DÍA', noche:'🌙 NOCHE', fuera:'🏨 FUERA'};
        
        datos.push({
            title: txt[currT], start: currF, backgroundColor: col[currT], borderColor: 'black',
            extendedProps: {
                tipo: currT,
                ruta: document.getElementById('sel-ruta').value,
                t1: document.getElementById('t1').value.toUpperCase(),
                t2: document.getElementById('t2').value.toUpperCase(),
                r1: document.getElementById('r1').value.toUpperCase(),
                r2: document.getElementById('r2').value.toUpperCase()
            }
        });
        localStorage.setItem('truck_pro_v2', JSON.stringify(datos));
        cal.removeAllEvents(); cal.addEventSource(datos);
        document.getElementById('form-dia').style.display = 'none';
        actualizarTodo();
    }

    function borrar() {
        datos = datos.filter(e => e.start !== currF);
        localStorage.setItem('truck_pro_v2', JSON.stringify(datos));
        cal.removeAllEvents(); cal.addEventSource(datos);
        document.getElementById('form-dia').style.display = 'none';
        actualizarTodo();
    }

    function addRutaLista() {
        const val = document.getElementById('nueva-ruta-input').value;
        if(!val) return;
        misRutas.push(val);
        localStorage.setItem('rutas_frecuentes', JSON.stringify(misRutas));
        document.getElementById('nueva-ruta-input').value = '';
        pintarRutasConfig();
        actualizarSelectRutas();
    }

    function eliminarRuta(idx) {
        misRutas.splice(idx, 1);
        localStorage.setItem('rutas_frecuentes', JSON.stringify(misRutas));
        pintarRutasConfig();
        actualizarSelectRutas();
    }

    function pintarRutasConfig() {
        const cont = document.getElementById('lista-rutas-config');
        cont.innerHTML = misRutas.map((r, i) => `
            <div class="ruta-item"><span>${r}</span><button class="btn-del" onclick="eliminarRuta(${i})">BORRAR</button></div>
        `).join('');
    }

    function actualizarSelectRutas() {
        const sel = document.getElementById('sel-ruta');
        sel.innerHTML = '<option value="">-- Selecciona Ruta --</option>' + 
            misRutas.map(r => `<option value="${r}">${r}</option>`).join('');
    }

    function pintarHistorial() {
        const cont = document.getElementById('historial-lista');
        cont.innerHTML = '';
        [...datos].sort((a,b) => new Date(b.start) - new Date(a.start)).forEach(e => {
            const p = e.extendedProps;
            cont.innerHTML += `
                <div class="card">
                    <div class="card-header"><span>📅 ${e.start}</span> <span style="color:${e.backgroundColor}">${e.title}</span></div>
                    <div style="font-size:14px; font-weight:bold; color:var(--domingo-color)">📍 ${p.ruta || 'Sin ruta'}</div>
                    <div style="font-size:12px; color:#555; margin-top:5px;">
                        🚛 T: ${p.t1||'-'} / ${p.t2||'-'} | 📦 R: ${p.r1||'-'} / ${p.r2||'-'}
                    </div>
                </div>
            `;
        });
    }

    function actualizarTodo() {
        if(!cal) return;
        const v = cal.getDate();
        const ini = new Date(v.getFullYear(), v.getMonth()-1, 26);
        const fin = new Date(v.getFullYear(), v.getMonth(), 25, 23, 59);
        const lista = datos.filter(e => { const f = new Date(e.start); return f>=ini && f<=fin; });
        
        document.getElementById('c-dia').innerText = lista.filter(e=>e.extendedProps.tipo==='dia').length;
        document.getElementById('c-noche').innerText = lista.filter(e=>e.extendedProps.tipo==='noche').length;
        document.getElementById('c-fuera').innerText = lista.filter(e=>e.extendedProps.tipo==='fuera').length;
        const doms = lista.filter(e => {
            const fe = new Date(e.start);
            return fe.getDay()===0 && (e.extendedProps.tipo==='dia'||e.extendedProps.tipo==='noche');
        }).length;
        document.getElementById('c-euros').innerText = doms * 50;
    }
</script>

</body>
</html>
