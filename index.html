<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora Furgo-Trayler</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        :root {
            --dia-color: #FFD700; --noche-color: #4B0082; --fuera-color: #FF4500; 
            --domingo-color: #27ae60; --accent: #2c3e50; --bg: #f4f4f9;
        }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg); padding-bottom: 80px; }
        #app { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; }
        
        header { 
            padding: 10px; text-align: center; background: white; position: sticky; top:0; z-index:100; 
            border-bottom: 1px solid #ddd; display: flex; justify-content: center; align-items: center; height: 65px; 
        }
        
        .tab-content { display: none; padding: 10px; }
        .tab-content.active { display: block; }

        .panel-dietas { background: #e8f5e9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #c8e6c9; }
        .stats { display: flex; justify-content: space-around; font-weight: bold; font-size: 14px; }
        .rango-txt { display: block; text-align: center; font-size: 11px; color: #666; margin-bottom: 5px; }

        /* Punto rojo corregido */
        .dot-obs {
            height: 10px; width: 10px; background-color: #e30613; border-radius: 50%;
            position: absolute; top: 2px; right: 2px; border: 1.5px solid white; z-index: 5;
        }

        .mes-separador { background: var(--accent); color: white; padding: 10px; border-radius: 6px; margin: 20px 0 10px 0; font-size: 14px; font-weight: bold; }
        .card { background: white; border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid var(--accent); position: relative; }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; font-size: 13px; }

        .form-contenedor { background: #fff; border: 2px solid var(--accent); border-radius: 12px; padding: 15px; margin-top: 10px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        input, select, textarea { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; }
        textarea { resize: none; height: 80px; }
        label { font-size: 11px; color: #666; font-weight: bold; text-transform: uppercase; margin-top: 8px; display: block; }

        .obs-box { background: #fff9c4; border-left: 3px solid #fbc02d; padding: 8px; margin-top: 8px; font-size: 12px; border-radius: 4px; color: #5d4037; }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-btn { background: none; border: none; color: #999; font-size: 11px; font-weight: bold; }
        .nav-btn.active { color: var(--accent); }

        .btn-turno { border: none; padding: 12px; border-radius: 8px; color: white; font-weight: bold; flex: 1; }
        .btn-turno.selected { outline: 3px solid black; opacity: 1 !important; }
        .btn-confirmar { background: var(--domingo-color); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; margin-top: 15px; font-weight: bold; font-size: 16px; }
        .btn-backup { background: #3498db; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div style="font-weight: 900; color: #e30613; font-size: 24px; font-style: italic;">
            FURGO<span style="color: #4d4d4d;">TRAYLER</span>
        </div>
    </header>

    <div id="tab-cal" class="tab-content active">
        <div class="panel-dietas">
            <span class="rango-txt" id="rango-f">...</span>
            <div class="stats">
                <span>☀️ <span id="c-dia">0</span></span>
                <span>🌙 <span id="c-noche">0</span></span>
                <span>🏨 <span id="c-fuera">0</span></span>
                <span style="color:var(--domingo-color)">€ <span id="c-euros">0</span></span>
            </div>
        </div>
        <div id="calendar"></div>
        
        <div id="form-dia" class="form-contenedor">
            <b id="fecha-label" style="font-size:18px;"></b>
            <div style="display:flex; gap:8px; margin: 15px 0;">
                <button id="b-dia" class="btn-turno" style="background:var(--dia-color);color:black;opacity:0.4" onclick="selT('dia')">DÍA</button>
                <button id="b-noche" class="btn-turno" style="background:var(--noche-color);opacity:0.4" onclick="selT('noche')">NOCHE</button>
                <button id="b-fuera" class="btn-turno" style="background:var(--fuera-color);opacity:0.4" onclick="selT('fuera')">FUERA</button>
                <button class="btn-turno" style="background:#888" onclick="borrar()">BORRAR</button>
            </div>
            
            <label>Ruta</label>
            <select id="sel-ruta"></select>
            
            <div class="form-grid">
                <div><label>T1</label><input type="text" id="t1"></div>
                <div><label>T2</label><input type="text" id="t2"></div>
                <div><label>R1</label><input type="text" id="r1"></div>
                <div><label>R2</label><input type="text" id="r2"></div>
            </div>
            
            <label>Observaciones</label>
            <textarea id="obs" placeholder="Escribe aquí notas o incidencias..."></textarea>
            
            <button class="btn-confirmar" onclick="guardar()">GUARDAR REGISTRO</button>
        </div>
    </div>

    <div id="tab-list" class="tab-content">
        <h3>Historial por Nómina</h3>
        <div id="historial-lista"></div>
    </div>

    <div id="tab-conf" class="tab-content">
        <h3>Copias de Seguridad</h3>
        <button class="btn-backup" onclick="exportar()">💾 CREAR ARCHIVO DE COPIA</button>
        <p style="font-size:12px; color:#666">Guarda este archivo para recuperar tus viajes y rutas si cambias de móvil.</p>
        
        <label>Cargar desde archivo:</label>
        <input type="file" id="importFile" onchange="importar(event)" style="margin-bottom:20px;">
        
        <hr>
        <h3>Gestión de Rutas</h3>
        <div style="display:flex; gap:5px;">
            <input type="text" id="nueva-ruta-input" placeholder="Nueva ruta...">
            <button onclick="addRutaLista()" style="background:var(--accent); color:white; border:none; padding:10px 15px; border-radius:8px;">+</button>
        </div>
        <div id="lista-rutas-config" style="margin-top:15px;"></div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="nav('cal')">📅<br>CALENDARIO</button>
        <button class="nav-btn" onclick="nav('list')">📋<br>HISTORIAL</button>
        <button class="nav-btn" onclick="nav('conf')">⚙️<br>AJUSTES</button>
    </nav>
</div>

<script>
    let cal, currF = null, currT = null;
    const K_DAT = 'furgotrayler_data';
    const K_RUT = 'furgotrayler_rutas';

    let datos = JSON.parse(localStorage.getItem(K_DAT)) || [];
    let misRutas = JSON.parse(localStorage.getItem(K_RUT)) || ['Ruta Local', 'Base-Base'];

    document.addEventListener('DOMContentLoaded', () => {
        const calendarEl = document.getElementById('calendar');
        cal = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth', locale: 'es', firstDay: 1, height: 'auto',
            headerToolbar: { left: 'prev,next', center: 'title', right: '' },
            events: datos,
            dateClick: (info) => { currF = info.dateStr; mostrarForm(info.dateStr); },
            datesSet: actualizarTodo,
            dayCellDidMount: (info) => {
                // CORRECCIÓN FECHA PUNTO ROJO: Usamos la fecha local
                const d = info.date;
                const offset = d.getTimezoneOffset() * 60000;
                const localISODate = (new Date(d.getTime() - offset)).toISOString().split('T')[0];
                
                const diaConDatos = datos.find(e => e.start === localISODate);
                if (diaConDatos && diaConDatos.extendedProps.obs && diaConDatos.extendedProps.obs.trim() !== "") {
                    const dot = document.createElement('div');
                    dot.className = 'dot-obs';
                    info.el.style.position = 'relative';
                    info.el.appendChild(dot);
                }
            }
        });
        cal.render();
        pintarRutasConfig();
        actualizarSelectRutas();
    });

    function nav(t) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        event.currentTarget.classList.add('active');
        if(t === 'cal') { cal.render(); cal.updateSize(); }
        if(t === 'list') pintarHistorialPorMeses();
    }

    function mostrarForm(f) {
        document.getElementById('form-dia').style.display = 'block';
        document.getElementById('fecha-label').innerText = f.split('-').reverse().join('/');
        const ex = datos.find(e => e.start === f);
        if(ex) {
            selT(ex.extendedProps.tipo);
            document.getElementById('t1').value = ex.extendedProps.t1 || '';
            document.getElementById('t2').value = ex.extendedProps.t2 || '';
            document.getElementById('r1').value = ex.extendedProps.r1 || '';
            document.getElementById('r2').value = ex.extendedProps.r2 || '';
            document.getElementById('sel-ruta').value = ex.extendedProps.ruta || '';
            document.getElementById('obs').value = ex.extendedProps.obs || '';
        } else {
            selT(null);
            document.querySelectorAll('#form-dia input, #form-dia textarea').forEach(i => i.value = '');
            document.getElementById('sel-ruta').value = '';
        }
        document.getElementById('form-dia').scrollIntoView({behavior: 'smooth'});
    }

    function selT(t) {
        currT = t;
        document.querySelectorAll('.btn-turno').forEach(b => b.classList.remove('selected'));
        if(t) document.getElementById('b-'+t).classList.add('selected');
    }

    function guardar() {
        if(!currT) return alert("Selecciona Turno (Día/Noche/Fuera)");
        datos = datos.filter(e => e.start !== currF);
        const col = {dia:'var(--dia-color)', noche:'var(--noche-color)', fuera:'var(--fuera-color)'};
        const txt = {dia:'☀️ DÍA', noche:'🌙 NOCHE', fuera:'🏨 FUERA'};
        
        datos.push({
            title: txt[currT], start: currF, backgroundColor: col[currT], borderColor: '#000',
            extendedProps: {
                tipo: currT, ruta: document.getElementById('sel-ruta').value,
                t1: document.getElementById('t1').value.toUpperCase(), t2: document.getElementById('t2').value.toUpperCase(),
                r1: document.getElementById('r1').value.toUpperCase(), r2: document.getElementById('r2').value.toUpperCase(),
                obs: document.getElementById('obs').value
            }
        });
        localStorage.setItem(K_DAT, JSON.stringify(datos));
        cal.removeAllEvents(); cal.addEventSource(datos);
        document.getElementById('form-dia').style.display = 'none';
        cal.render(); // Refresca puntos rojos
        actualizarTodo();
    }

    function borrar() {
        datos = datos.filter(e => e.start !== currF);
        localStorage.setItem(K_DAT, JSON.stringify(datos));
        cal.removeAllEvents(); cal.addEventSource(datos);
        document.getElementById('form-dia').style.display = 'none';
        cal.render();
        actualizarTodo();
    }

    // --- COPIA DE SEGURIDAD REFORZADA ---
    function exportar() {
        const copiaCompleta = {
            viajes: datos,
            rutas: misRutas,
            fechaCopia: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(copiaCompleta)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `FURGO_COPIA_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function importar(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const res = JSON.parse(e.target.result);
                if (res.viajes) {
                    datos = res.viajes;
                    localStorage.setItem(K_DAT, JSON.stringify(datos));
                }
                if (res.rutas) {
                    misRutas = res.rutas;
                    localStorage.setItem(K_RUT, JSON.stringify(misRutas));
                }
                alert("✅ Copia cargada: Viajes y Rutas recuperados.");
                location.reload();
            } catch (err) {
                alert("❌ Error al leer el archivo.");
            }
        };
        reader.readAsText(file);
    }

    // --- RUTAS ---
    function addRutaLista() {
        const v = document.getElementById('nueva-ruta-input').value;
        if(v) { 
            misRutas.push(v); 
            localStorage.setItem(K_RUT, JSON.stringify(misRutas)); 
            pintarRutasConfig(); actualizarSelectRutas(); 
            document.getElementById('nueva-ruta-input').value = '';
        }
    }
    function pintarRutasConfig() {
        document.getElementById('lista-rutas-config').innerHTML = misRutas.map((r, i) => `
            <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                <span>${r}</span><button onclick="eliminarRuta(${i})" style="color:red; border:none; background:none; font-weight:bold;">X</button>
            </div>`).join('');
    }
    function eliminarRuta(idx) {
        misRutas.splice(idx, 1);
        localStorage.setItem(K_RUT, JSON.stringify(misRutas));
        pintarRutasConfig(); actualizarSelectRutas();
    }
    function actualizarSelectRutas() {
        document.getElementById('sel-ruta').innerHTML = '<option value="">-- Selecciona Ruta --</option>' + 
            misRutas.map(r => `<option value="${r}">${r}</option>`).join('');
    }

    function pintarHistorialPorMeses() {
        const cont = document.getElementById('historial-lista');
        cont.innerHTML = '';
        if(datos.length === 0) { cont.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">No hay viajes registrados.</p>'; return; }
        const ordenados = [...datos].sort((a,b) => new Date(b.start) - new Date(a.start));
        let lastM = "";
        ordenados.forEach(e => {
            const f = new Date(e.start);
            let mN = (f.getDate() > 25) ? f.getMonth() + 1 : f.getMonth();
            let aN = f.getFullYear(); if(mN > 11) { mN = 0; aN++; }
            const nomM = new Intl.DateTimeFormat('es', { month: 'long' }).format(new Date(aN, mN));
            const idM = `${nomM} ${aN}`;
            if(idM !== lastM) {
                lastM = idM;
                cont.innerHTML += `<div class="mes-separador">NÓMINA ${idM.toUpperCase()}</div>`;
            }
            const p = e.extendedProps;
            let obsH = p.obs ? `<div class="obs-box"><b>Obs:</b> ${p.obs}</div>` : '';
            cont.innerHTML += `<div class="card" onclick="irAFecha('${e.start}')">
                <div class="card-header"><span>📅 ${e.start.split('-').reverse().join('/')}</span> <span style="color:${e.backgroundColor}">${e.title}</span></div>
                <div style="font-weight:bold; color:var(--domingo-color)">📍 ${p.ruta || '-'}</div>
                <div style="font-size:11px; color:#666; margin-top:5px;">${p.t1||''} ${p.t2||''} | ${p.r1||''} ${p.r2||''}</div>
                ${obsH}
            </div>`;
        });
    }

    function irAFecha(f) { nav('cal'); cal.gotoDate(f); mostrarForm(f); }

    function actualizarTodo() {
        const v = cal.getDate();
        const ini = new Date(v.getFullYear(), v.getMonth() - 1, 26);
        const fin = new Date(v.getFullYear(), v.getMonth(), 25, 23, 59);
        document.getElementById('rango-f').innerText = `${ini.toLocaleDateString('es',{day:'numeric',month:'short'})} al ${fin.toLocaleDateString('es',{day:'numeric',month:'short'})}`;
        const lista = datos.filter(e => { const f = new Date(e.start); return f>=ini && f<=fin; });
        document.getElementById('c-dia').innerText = lista.filter(e=>e.extendedProps.tipo==='dia').length;
        document.getElementById('c-noche').innerText = lista.filter(e=>e.extendedProps.tipo==='noche').length;
        document.getElementById('c-fuera').innerText = lista.filter(e=>e.extendedProps.tipo==='fuera').length;
        const doms = lista.filter(e => {
            const fe = new Date(e.start);
            return fe.getDay()===0 && (e.extendedProps.tipo==='dia'||e.extendedProps.tipo==='noche');
        }).length;
        document.getElementById('c-euros').innerText = doms * 50;
    }
</script>
</body>
</html>
