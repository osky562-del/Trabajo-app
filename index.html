<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Trabajo PRO</title>
<style>
body{
    font-family: Arial;
    background:#0C1219;
    color:white;
    text-align:center;
    padding:15px;
}

input, select, button, textarea{
    width:90%;
    padding:10px;
    margin:6px;
    border-radius:8px;
    border:none;
}

button{
    background:#1E90FF;
    color:white;
    font-weight:bold;
}

.calendar{
    display:grid;
    grid-template-columns: repeat(7,1fr);
    gap:5px;
    margin-top:20px;
}

.day{
    padding:10px;
    border-radius:6px;
    background:#162030;
    cursor:pointer;
    font-size:14px;
}

.list-container{
    text-align:left;
    margin:10px auto;
    width:90%;
}

h3,h4{
    margin-top:15px;
}
</style>
</head>
<body>
<h2>🚛 Control Trabajo PRO</h2>
<h4>Registrar día:</h4>
<select id="tipo">
<option value="dia">🌞 Día</option>
<option value="noche">🌙 Noche</option>
<option value="libre">🟡 Dormido fuera</option>
</select>
<h4>Camiones y plataformas</h4>
<textarea id="camionA" placeholder="Camión A"></textarea>
<textarea id="plataformaA" placeholder="Plataforma A"></textarea>
<textarea id="camionB" placeholder="Camión B (opcional)"></textarea>
<textarea id="plataformaB" placeholder="Plataforma B (opcional)"></textarea>
<h4>Ruta y horarios</h4>
<textarea id="ruta" placeholder="Ruta"></textarea>
<input id="salida" type="time" placeholder="Hora salida">
<input id="llegada" type="time" placeholder="Hora llegada">
<h3>Resumen mensual</h3>
<div id="resumen"></div>
<h3>Calendario</h3>
<div class="calendar" id="calendar"></div>
<script>

// --- Datos guardados ---
let data = JSON.parse(localStorage.getItem("trabajoData")||"{}");

// --- Guardar día ---
function guardar(){
let hoy = new Date().toISOString().split("T")[0];

data[hoy] = {
tipo: document.getElementById("tipo").value,
camionA: document.getElementById("camionA").value,
plataformaA: document.getElementById("plataformaA").value,
camionB: document.getElementById("camionB").value,
plataformaB: document.getElementById("plataformaB").value,
ruta: document.getElementById("ruta").value,
salida: document.getElementById("salida").value,
llegada: document.getElementById("llegada").value
};

localStorage.setItem("trabajoData",JSON.stringify(data));
alert("Guardado ✔");
renderCalendar();
renderResumen();
}

// --- Renderizar calendario ---
function renderCalendar(){
let calendar = document.getElementById("calendar");
calendar.innerHTML="";

let now = new Date();
let year = now.getFullYear();
let month = now.getMonth();

let firstDay = new Date(year,month,1).getDay();
let daysInMonth = new Date(year,month+1,0).getDate();

for(let i=0;i<firstDay;i++){ calendar.innerHTML+="<div></div>"; }

for(let d=1; d<=daysInMonth; d++){
let date = new Date(year,month,d).toISOString().split("T")[0];
let tipo = data[date]?.tipo || "libre";

let color="#162030";
if(tipo==="dia") color="#2ecc71";
if(tipo==="noche") color="#e74c3c";
if(tipo==="libre") color="#f1c40f";

calendar.innerHTML+=`
<div class="day" style="background:${color}"
onclick="alert(JSON.stringify(data['${date}']||{}))">
${d}
</div>`;
}
}

// --- Renderizar resumen mensual ---
function renderResumen(){
let now = new Date();
let month = now.getMonth();
let year = now.getFullYear();

let diasTrabajados = [];
let horasTotales = 0;

for(let fecha in data){
let f = new Date(fecha);
if(f.getMonth()===month && f.getFullYear()===year && data[fecha].tipo!=="libre"){
diasTrabajados.push(fecha);
if(data[fecha].salida && data[fecha].llegada){
let s = data[fecha].salida.split(":");
let l = data[fecha].llegada.split(":");
let inicio = parseInt(s[0])*60+parseInt(s[1]);
let fin = parseInt(l[0])*60+parseInt(l[1]);
let diff = fin-inicio;
if(diff<0) diff+=24*60; // si pasas medianoche
horasTotales+=diff;
}
}
}

let resumenDiv = document.getElementById("resumen");
resumenDiv.innerHTML=
`<p>Días trabajados este mes: ${diasTrabajados.length}</p>
<p>Total horas trabajadas: ${Math.floor(horasTotales/60)}h ${horasTotales%60}m</p>
<p>Días concretos trabajados: ${diasTrabajados.join(", ")}</p>`;
}

renderCalendar();
renderResumen();

</script>
</body>
</html>
:::
