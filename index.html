<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro Camionero</title>

<style>

body{
margin:0;
background:#0f172a;
font-family:Arial;
display:flex;
justify-content:center;
}

.app{
max-width:500px;
width:100%;
padding:15px;
color:white;
text-align:center;
}

h1{
font-size:26px;
margin-bottom:10px;
}

select,input,button{
width:100%;
padding:14px;
margin-top:6px;
font-size:16px;
border-radius:10px;
border:none;
}

button{
font-weight:bold;
}

.save{
background:#22c55e;
color:white;
}

.delete{
background:#ef4444;
color:white;
}

#calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
margin-top:15px;
}

.day{
padding:18px;
background:#1e293b;
border-radius:10px;
font-size:18px;
}

.trabajoDia{
background:#22c55e;
}

.trabajoNoche{
background:#ef4444;
}

.dormir{
background:#f59e0b;
}

.panel{
margin-top:20px;
}

.summary{
margin-top:20px;
font-size:18px;
}

.legend{
margin-top:25px;
}

.box{
width:16px;
height:16px;
display:inline-block;
margin-right:6px;
border-radius:4px;
}

.green{background:#22c55e;}
.red{background:#ef4444;}
.orange{background:#f59e0b;}

</style>

</head>

<body>

<div class="app">

<h1>Registro de Trabajo</h1>

<select id="month"></select>
<select id="year"></select>

<div id="calendar"></div>

<div class="panel">

<h3>Día seleccionado: <span id="selectedDay">-</span></h3>

<select id="tipo">
<option value="">Tipo de trabajo</option>
<option value="dia">Trabajo de día</option>
<option value="noche">Trabajo de noche</option>
<option value="dormir">Dormir fuera</option>
</select>

<input id="camion1" placeholder="Camión 1">
<input id="plataforma1" placeholder="Plataforma 1">

<input id="camion2" placeholder="Camión 2 (opcional)">
<input id="plataforma2" placeholder="Plataforma 2 (opcional)">

<input id="ruta" placeholder="Ruta">

<input id="salida" placeholder="Hora salida">
<input id="llegada" placeholder="Hora llegada">

<button class="save" onclick="guardar()">Guardar día</button>
<button class="delete" onclick="borrar()">Borrar día</button>

</div>

<div class="summary">

<h3>Resumen</h3>

<p>Días trabajados este mes: <b id="mes">0</b></p>
<p>Días trabajados este año: <b id="anio">0</b></p>

</div>

<div class="legend">

<h3>Leyenda</h3>

<p><span class="box green"></span>Trabajo de día</p>
<p><span class="box red"></span>Trabajo de noche</p>
<p><span class="box orange"></span>Dormir fuera</p>

</div>

</div>

<script>

let selected=null

let data=JSON.parse(localStorage.getItem("trabajo"))||{}

const calendar=document.getElementById("calendar")
const monthSelect=document.getElementById("month")
const yearSelect=document.getElementById("year")

const months=[
"Enero","Febrero","Marzo","Abril","Mayo","Junio",
"Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
]

months.forEach((m,i)=>{

let op=document.createElement("option")
op.value=i
op.text=m

monthSelect.appendChild(op)

})

for(let y=2024;y<=2045;y++){

let op=document.createElement("option")
op.value=y
op.text=y

yearSelect.appendChild(op)

}

monthSelect.value=new Date().getMonth()
yearSelect.value=new Date().getFullYear()

monthSelect.onchange=draw
yearSelect.onchange=draw

function draw(){

calendar.innerHTML=""

let m=parseInt(monthSelect.value)
let y=parseInt(yearSelect.value)

let days=new Date(y,m+1,0).getDate()

for(let d=1;d<=days;d++){

let div=document.createElement("div")

div.className="day"

div.innerText=d

let key=y+"-"+m+"-"+d

if(data[key]){

if(data[key].tipo==="dia") div.classList.add("trabajoDia")

if(data[key].tipo==="noche") div.classList.add("trabajoNoche")

if(data[key].tipo==="dormir") div.classList.add("dormir")

}

div.onclick=()=>selectDay(d)

calendar.appendChild(div)

}

resumen()

}

function selectDay(d){

selected=d

document.getElementById("selectedDay").innerText=d

}

function guardar(){

if(!selected){

alert("Selecciona un día")

return

}

let m=monthSelect.value
let y=yearSelect.value

let key=y+"-"+m+"-"+selected

data[key]={

tipo:document.getElementById("tipo").value,

camion1:document.getElementById("camion1").value,

plataforma1:document.getElementById("plataforma1").value,

camion2:document.getElementById("camion2").value,

plataforma2:document.getElementById("plataforma2").value,

ruta:document.getElementById("ruta").value,

salida:document.getElementById("salida").value,

llegada:document.getElementById("llegada").value

}

localStorage.setItem("trabajo",JSON.stringify(data))

draw()

}

function borrar(){

if(!selected)return

let m=monthSelect.value
let y=yearSelect.value

let key=y+"-"+m+"-"+selected

delete data[key]

localStorage.setItem("trabajo",JSON.stringify(data))

draw()

}

function resumen(){

let m=monthSelect.value
let y=yearSelect.value

let mes=0
let anio=0

for(let k in data){

let parts=k.split("-")

if(parts[0]==y && parts[1]==m) mes++

if(parts[0]==y) anio++

}

document.getElementById("mes").innerText=mes

document.getElementById("anio").innerText=anio

}

draw()

</script>

</body>

</html>
