<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Cuadrante 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        :root {
            --dia-color: #FFD700;
            --noche-color: #4B0082;
            --fuera-color: #FF4500;
            --bg-color: #f4f4f9;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg-color); }
        #app { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        header { padding: 15px; text-align: center; background: #333; color: white; }
        
        #calendar { padding: 10px; flex-grow: 1; }

        /* Estilos del Panel de Control */
        .controls { padding: 20px; border-top: 1px solid #ddd; background: #fff; position: sticky; bottom: 0; }
        .selected-date { font-weight: bold; margin-bottom: 10px; display: block; text-align: center; color: #555; }
        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        button { border: none; padding: 12px 5px; border-radius: 8px; color: white; font-weight: bold; font-size: 12px; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.6; }
        
        .btn-dia { background-color: var(--dia-color); color: #333; }
        .btn-noche { background-color: var(--noche-color); }
        .btn-fuera { background-color: var(--fuera-color); }
        .btn-borrar { background-color: #bbb; }

        /* Resumen mensual */
        .resumen { display: flex; justify-content: space-around; padding: 15px; background: #eee; font-size: 14px; font-weight: bold; }
        
        /* Ajustes de FullCalendar para móvil */
        .fc-header-toolbar { font-size: 0.8em; }
        .fc-daygrid-day { height: 80px !important; }
    </style>
</head>
<body>

<div id="app">
    <header>📅 Mi Cuadrante de Trabajo</header>
    
    <div id="calendar"></div>

    <div class="resumen" id="resumen">
        <span>☀️: <span id="count-dia">0</span></span>
        <span>🌙: <span id="count-noche">0</span></span>
        <span>🏨: <span id="count-fuera">0</span></span>
    </div>

    <div class="controls">
        <span class="selected-date" id="date-label">Selecciona un día</span>
        <div class="btn-group">
            <button class="btn-dia" onclick="setTurno('dia')">DÍA</button>
            <button class="btn-noche" onclick="setTurno('noche')">NOCHE</button>
            <button class="btn-fuera" onclick="setTurno('fuera')">FUERA</button>
            <button class="btn-borrar" onclick="setTurno(null)">BORRAR</button>
        </div>
    </div>
</div>

<script>
    let calendar;
    let selectedDateStr = null;
    let eventos = JSON.parse(localStorage.getItem('mis_eventos')) || [];

    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'es',
            firstDay: 1, // Lunes
            selectable: true,
            headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
            events: eventos,
            dateClick: function(info) {
                selectedDateStr = info.dateStr;
                document.getElementById('date-label').innerText = "Día: " + info.dateStr;
            },
            datesSet: actualizarResumen // Se ejecuta al cambiar de mes
        });
        calendar.render();
        actualizarResumen();
    });

    function setTurno(tipo) {
        if (!selectedDateStr) {
            alert("Por favor, toca un día en el calendario");
            return;
        }

        // Eliminar evento previo en esa fecha si existe
        eventos = eventos.filter(e => e.start !== selectedDateStr);

        if (tipo) {
            let color, titulo;
            if (tipo === 'dia') { color = '#FFD700'; titulo = '☀️ DÍA'; }
            if (tipo === 'noche') { color = '#4B0082'; titulo = '🌙 NOCHE'; }
            if (tipo === 'fuera') { color = '#FF4500'; titulo = '🏨 FUERA'; }
            
            eventos.push({
                title: titulo,
                start: selectedDateStr,
                backgroundColor: color,
                borderColor: color,
                allDay: true,
                extendedProps: { tipo: tipo }
            });
        }

        guardarYRefrescar();
    }

    function guardarYRefrescar() {
        localStorage.setItem('mis_eventos', JSON.stringify(eventos));
        calendar.removeAllEvents();
        calendar.addEventSource(eventos);
        actualizarResumen();
    }

    function actualizarResumen() {
        if (!calendar) return;
        const currentMonth = calendar.getDate().getMonth();
        const currentYear = calendar.getDate().getFullYear();

        const filtrados = eventos.filter(e => {
            const d = new Date(e.start);
            return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
        });

        document.getElementById('count-dia').innerText = filtrados.filter(e => e.extendedProps.tipo === 'dia').length;
        document.getElementById('count-noche').innerText = filtrados.filter(e => e.extendedProps.tipo === 'noche').length;
        document.getElementById('count-fuera').innerText = filtrados.filter(e => e.extendedProps.tipo === 'fuera').length;
    }
</script>

</body>
</html>
