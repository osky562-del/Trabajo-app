<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Trabajo</title>
<style>

body{
font-family:Arial;
background:#0C1219;
color:white;
text-align:center;
padding:15px;
}

button,input,textarea,select{
width:90%;
padding:10px;
margin:6px;
border-radius:8px;
border:none;
}

button{
background:#1E90FF;
color:white;
font-weight:bold;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
margin-top:20px;
}

.day{
padding:10px;
border-radius:6px;
background:#162030;
cursor:pointer;
}

.selected{
outline:3px solid white;
}

</style>
</head>
<body>
<h2>🚛 Control Trabajo</h2>
<div>
<button onclick="mesAnterior()">◀</button>
<span id="mesActual"></span>
<button onclick="mesSiguiente()">▶</button>
</div>
<div class="calendar" id="calendar"></div>
<h3>Día seleccionado: <span id="fechaSeleccionada">ninguno</span></h3>
<select id="tipo">
<option value="dia">🌞 Día</option>
<option value="noche">🌙 Noche</option>
<option value="fuera">🟡 Dormido fuera</option>
</select>
<textarea id="camionA" placeholder="Camión A"></textarea>
<textarea id="plataformaA" placeholder="Plataforma A"></textarea>
<textarea id="camionB" placeholder="Camión B (opcional)"></textarea>
<textarea id="plataformaB" placeholder="Plataforma B (opcional)"></textarea>
<textarea id="ruta" placeholder="Ruta"></textarea>
<input id="salida" type="time">
<input id="llegada" type="time">
<h3>Resumen del mes</h3>
<div id="resumen"></div>
<script>

let data = JSON.parse(localStorage.getItem("trabajoData")||"{}");

let fechaSeleccionada=null;

let fechaActual=new Date();

function guardar(){

if(!fechaSeleccionada){
alert("Selecciona un día en el calendario");
return;
}

data[fechaSeleccionada]={

tipo:tipo.value,
camionA:camionA.value,
plataformaA:plataformaA.value,
camionB:camionB.value,
plataformaB:plataformaB.value,
ruta:ruta.value,
salida:salida.value,
llegada:llegada.value

};

localStorage.setItem("trabajoData",JSON.stringify(data));

alert("Guardado ✔");

renderCalendar();
renderResumen();

}

function seleccionarDia(date){

fechaSeleccionada=date;

fechaSeleccionadaTexto.innerText=date;

let info=data[date]||{};

tipo.value=info.tipo||"dia";
camionA.value=info.camionA||"";
plataformaA.value=info.plataformaA||"";
camionB.value=info.camionB||"";
plataformaB.value=info.plataformaB||"";
ruta.value=info.ruta||"";
salida.value=info.salida||"";
llegada.value=info.llegada||"";

}

function renderCalendar(){

calendar.innerHTML="";

let year=fechaActual.getFullYear();
let month=fechaActual.getMonth();

mesActual.innerText=(month+1)+" / "+year;

let firstDay=new Date(year,month,1).getDay();
let daysInMonth=new Date(year,month+1,0).getDate();

for(let i=0;i<firstDay;i++) calendar.innerHTML+="<div></div>";

for(let d=1;d<=daysInMonth;d++){

let date=new Date(year,month,d).toISOString().split("T")[0];

let tipoDia=data[date]?.tipo;

let color="#162030";

if(tipoDia==="dia") color="#2ecc71";
if(tipoDia==="noche") color="#e74c3c";
if(tipoDia==="fuera") color="#f1c40f";

calendar.innerHTML+=`
<div class="day"
style="background:${color}"
onclick="seleccionarDia('${date}')">
${d}
</div>
`;

}

}

function renderResumen(){

let year=fechaActual.getFullYear();
let month=fechaActual.getMonth();

let dias=0;
let horas=0;

for(let fecha in data){

let f=new Date(fecha);

if(f.getFullYear()==year && f.getMonth()==month){

dias++;

let s=data[fecha].salida;
let l=data[fecha].llegada;

if(s && l){

let ss=s.split(":");
let ll=l.split(":");

let inicio=ss[0]*60+parseInt(ss[1]);
let fin=ll[0]*60+parseInt(ll[1]);

let diff=fin-inicio;
if(diff<0) diff+=1440;

horas+=diff;

}

}

}

resumen.innerHTML=
"Días registrados: "+dias+
"<br>Total horas: "+Math.floor(horas/60)+"h "+horas%60+"m";

}

function mesAnterior(){

fechaActual.setMonth(fechaActual.getMonth()-1);

renderCalendar();
renderResumen();

}

function mesSiguiente(){

fechaActual.setMonth(fechaActual.getMonth()+1);

renderCalendar();
renderResumen();

}

renderCalendar();
renderResumen();

</script>
</body>
</html>
:::
