<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Trabajo PRO</title>

<style>

body{
font-family:Arial;
background:#0C1219;
color:white;
text-align:center;
padding:15px;
}

button,input,textarea,select{
width:90%;
padding:10px;
margin:6px;
border-radius:8px;
border:none;
}

button{
background:#1E90FF;
color:white;
font-weight:bold;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
margin-top:20px;
}

.day{
padding:12px;
border-radius:6px;
background:#162030;
cursor:pointer;
}

.selected{
outline:3px solid white;
}

</style>
</head>

<body>

<h2>🚛 Control Trabajo</h2>

<div>
<button onclick="mesAnterior()">◀</button>
<span id="mesTexto"></span>
<button onclick="mesSiguiente()">▶</button>
</div>

<div class="calendar" id="calendar"></div>

<h3>Día seleccionado: <span id="fechaTexto">ninguno</span></h3>

<select id="tipo">
<option value="dia">🌞 Trabajo de día</option>
<option value="noche">🌙 Trabajo de noche</option>
</select>

<label>
<input type="checkbox" id="dormirFuera">
Dormir fuera
</label>

<textarea id="camionA" placeholder="Camión A"></textarea>
<textarea id="plataformaA" placeholder="Plataforma A"></textarea>

<textarea id="camionB" placeholder="Camión B (opcional)"></textarea>
<textarea id="plataformaB" placeholder="Plataforma B (opcional)"></textarea>

<textarea id="ruta" placeholder="Ruta"></textarea>

<input id="salida" type="time">
<input id="llegada" type="time">

<button onclick="guardar()">Guardar día</button>

<h3>Resumen del mes</h3>
<div id="resumenMes"></div>

<h3>Resumen del año</h3>
<div id="resumenAnual"></div>

<script>

let data = JSON.parse(localStorage.getItem("trabajoData")||"{}");

let fechaSeleccionada=null;
let fechaActual=new Date();

function guardar(){

if(!fechaSeleccionada){
alert("Selecciona un día");
return;
}

data[fechaSeleccionada]={

tipo:tipo.value,
dormirFuera:dormirFuera.checked,
camionA:camionA.value,
plataformaA:plataformaA.value,
camionB:camionB.value,
plataformaB:plataformaB.value,
ruta:ruta.value,
salida:salida.value,
llegada:llegada.value

};

localStorage.setItem("trabajoData",JSON.stringify(data));

alert("Guardado");

renderCalendar();
renderResumen();

}

function seleccionarDia(date){

fechaSeleccionada=date;

document.getElementById("fechaTexto").innerText=date;

let info=data[date]||{};

tipo.value=info.tipo||"dia";
dormirFuera.checked=info.dormirFuera||false;

camionA.value=info.camionA||"";
plataformaA.value=info.plataformaA||"";

camionB.value=info.camionB||"";
plataformaB.value=info.plataformaB||"";

ruta.value=info.ruta||"";

salida.value=info.salida||"";
llegada.value=info.llegada||"";

renderCalendar();

}

function renderCalendar(){

calendar.innerHTML="";

let year=fechaActual.getFullYear();
let month=fechaActual.getMonth();

document.getElementById("mesTexto").innerText=(month+1)+" / "+year;

let firstDay=new Date(year,month,1).getDay();
let daysInMonth=new Date(year,month+1,0).getDate();

for(let i=0;i<firstDay;i++) calendar.innerHTML+="<div></div>";

for(let d=1;d<=daysInMonth;d++){

let date=new Date(year,month,d).toISOString().split("T")[0];

let info=data[date];

let color="#162030";

if(info){

if(info.tipo==="dia") color="#2ecc71";

if(info.tipo==="noche") color="#e74c3c";

if(info.dormirFuera) color="#f1c40f";

}

let clase="day";

if(date===fechaSeleccionada) clase+=" selected";

calendar.innerHTML+=`
<div class="${clase}"
style="background:${color}"
onclick="seleccionarDia('${date}')">
${d}
</div>
`;

}

}

function renderResumen(){

let year=fechaActual.getFullYear();
let month=fechaActual.getMonth();

let diasMes=0;
let dormirMes=0;

let diasAno=0;
let dormirAno=0;

for(let fecha in data){

let f=new Date(fecha);

if(f.getFullYear()==year){

diasAno++;

if(data[fecha].dormirFuera) dormirAno++;

}

if(f.getFullYear()==year && f.getMonth()==month){

diasMes++;

if(data[fecha].dormirFuera) dormirMes++;

}

}

document.getElementById("resumenMes").innerHTML=
"Días trabajados: "+diasMes+
"<br>Noches fuera: "+dormirMes;

document.getElementById("resumenAnual").innerHTML=
"Días trabajados en el año: "+diasAno+
"<br>Noches fuera en el año: "+dormirAno;

}

function mesAnterior(){

fechaActual.setMonth(fechaActual.getMonth()-1);

renderCalendar();
renderResumen();

}

function mesSiguiente(){

fechaActual.setMonth(fechaActual.getMonth()+1);

renderCalendar();
renderResumen();

}

renderCalendar();
renderResumen();

</script>

</body>
</html>
