<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora Furgo-Trayler</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        :root {
            --dia-color: #FFD700; --noche-color: #4B0082; --fuera-color: #FF4500; 
            --domingo-color: #27ae60; --accent: #2c3e50; --bg: #f4f4f9;
        }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg); padding-bottom: 80px; }
        #app { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; }
        
        header { 
            padding: 10px; text-align: center; background: white; position: sticky; top:0; z-index:100; 
            border-bottom: 1px solid #ddd; display: flex; justify-content: center; align-items: center; height: 65px; 
        }
        
        .tab-content { display: none; padding: 10px; }
        .tab-content.active { display: block; }

        .panel-dietas { background: #e8f5e9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #c8e6c9; }
        .stats { display: flex; justify-content: space-around; font-weight: bold; font-size: 14px; }
        .rango-txt { display: block; text-align: center; font-size: 11px; color: #666; margin-bottom: 5px; }

        /* Punto de observación corregido */
        .dot-obs {
            height: 8px; width: 8px; background-color: #e30613; border-radius: 50%;
            display: inline-block; position: absolute; top: 4px; right: 4px; border: 1px solid white;
        }

        .mes-separador { background: var(--accent); color: white; padding: 8px 15px; border-radius: 6px; margin: 20px 0 10px 0; font-size: 14px; font-weight: bold; }
        .card { background: white; border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid var(--accent); }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; font-size: 13px; }

        .form-contenedor { background: #fff; border: 2px solid var(--accent); border-radius: 12px; padding: 15px; margin-top: 10px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; font-family: inherit; }
        textarea { resize: none; height: 60px; }
        label { font-size: 10px; color: #666; font-weight: bold; text-transform: uppercase; margin-top: 5px; display: block; }

        .obs-box { background: #fff9c4; border-left: 3px solid #fbc02d; padding: 8px; margin-top: 8px; font-size: 12px; border-radius: 4px; color: #5d4037; }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-btn { background: none; border: none; color: #999; font-size: 10px; font-weight: bold; }
        .nav-btn.active { color: var(--accent); }

        .btn-turno { border: none; padding: 10px; border-radius: 6px; color: white; font-weight: bold; font-size: 11px; opacity: 0.4; flex: 1; }
        .btn-turno.selected { opacity: 1; border: 2px solid black; }
        .btn-confirmar { background: var(--domingo-color); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-backup { background: #3498db; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div style="font-weight: 900; color: #e30613; font-size: 24px; font-style: italic;">
            FURGO<span style="color: #4d4d4d;">TRAYLER</span>
        </div>
    </header>

    <div id="tab-cal" class="tab-content active">
        <div class="panel-dietas">
            <span class="rango-txt" id="rango-f">Periodo: 26 al 25</span>
            <div class="stats">
                <span>☀️ <span id="c-dia">0</span></span>
                <span>🌙 <span id="c-noche">0</span></span>
                <span>🏨 <span id="c-fuera">0</span></span>
                <span style="color:var(--domingo-color)">€ <span id="c-euros">0</span></span>
            </div>
        </div>
        <div id="calendar"></div>
        
        <div id="form-dia" class="form-contenedor">
            <b id="fecha-label"></b>
            <div style="display:flex; gap:5px; margin: 10px 0;">
                <button id="b-dia" class="btn-turno" style="background:var(--dia-color);color:black" onclick="selT('dia')">DÍA</button>
                <button id="b-noche" class="btn-turno" style="background:var(--noche-color)" onclick="selT('noche')">NOCHE</button>
                <button id="b-fuera" class="btn-turno" style="background:var(--fuera-color)" onclick="selT('fuera')">FUERA</button>
                <button class="btn-turno" style="background:#888; opacity:1" onclick="borrar()">BORRAR</button>
            </div>
            <label>Ruta</label>
            <select id="sel-ruta"></select>
            <div class="form-grid">
                <div><label>T1</label><input type="text" id="t1"></div>
                <div><label>T2</label><input type="text" id="t2"></div>
                <div><label>R1</label><input type="text" id="r1"></div>
                <div><label>R2</label><input type="text" id="r2"></div>
            </div>
            <label>Observaciones</label>
            <textarea id="obs" placeholder="Notas extra..."></textarea>
            <button class="btn-confirmar" onclick="guardar()">GUARDAR DÍA</button>
        </div>
    </div>

    <div id="tab-list" class="tab-content">
        <h3>Historial por Nóminas</h3>
        <div id="historial-lista"></div>
    </div>

    <div id="tab-conf" class="tab-content">
        <h3>Copia de Seguridad (Todas las pestañas)</h3>
        <button class="btn-backup" onclick="exportar()">💾 GUARDAR COPIA COMPLETA</button>
        <p style="font-size: 11px; color: #666;">Descarga un archivo con tus viajes, rutas y notas.</p>
        
        <label>Cargar copia de seguridad:</label>
        <input type="file" id="importFile" onchange="importar(event)" style="margin-top:5px; font-size:12px;">
        
        <hr style="margin: 20px 0;">
        <h3>Mis Rutas Guardadas</h3>
        <div style="display:flex; gap:5px;">
            <input type="text" id="nueva-ruta-input" placeholder="Ej: Barcelona-Madrid">
            <button onclick="addRutaLista()" style="background:var(--accent); color:white; border:none; padding:10px; border-radius:6px;">+</button>
        </div>
        <div id="lista-rutas-config" style="margin-top:20px;"></div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="nav('cal')">📅<br>CALENDARIO</button>
        <button class="nav-btn" onclick="nav('list')">📋<br>HISTORIAL</button>
        <button class="nav-btn" onclick="nav('conf')">⚙️<br>AJUSTES</button>
    </nav>
</div>

<script>
    let cal, currF = null, currT = null;
    const STORAGE_KEY = 'furgotrayler_v_unificada';
    const RUTAS_KEY = 'furgotrayler_rutas_v_unificada';

    let datos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let misRutas = JSON.parse(localStorage.getItem(RUTAS_KEY)) || ['Ruta Local', 'Base-Base'];

    document.addEventListener('DOMContentLoaded', () => {
        cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth', locale: 'es', firstDay: 1, height: 'auto',
            headerToolbar: { left: 'prev,next', center: 'title', right: '' },
            events: datos,
            dateClick: (i) => { currF = i.dateStr; mostrarForm(i.dateStr); },
            datesSet: actualizarTodo,
            dayCellDidMount: (info) => {
                // Lógica de punto rojo corregida para evitar desfases de fecha
                const dateIso = info.date.toLocaleDateString('en-CA'); 
                const item = datos.find(d => d.start === dateIso);
                if (item && item.extendedProps?.obs?.trim()) {
                    const dot = document.createElement('span');
                    dot.className = 'dot-obs';
                    info.el.querySelector('.fc-daygrid-day-top').appendChild(dot);
                }
            }
        });
        cal.render();
        pintarRutasConfig();
        actualizarSelectRutas();
    });

    function nav(t) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        event.currentTarget.classList.add('active');
        if(t === 'cal') { cal.render(); cal.updateSize(); }
        if(t === 'list') pintarHistorialPorMeses();
    }

    function mostrarForm(f) {
        document.getElementById('form-dia').style.display = 'block';
        document.getElementById('fecha-label').innerText = "Día: " + f;
        const ex = datos.find(e => e.start === f);
        if(ex) {
            selT(ex.extendedProps.tipo);
            document.getElementById('t1').value = ex.extendedProps.t1 || '';
            document.getElementById('t2').value = ex.extendedProps.t2 || '';
            document.getElementById('r1').value = ex.extendedProps.r1 || '';
            document.getElementById('r2').value = ex.extendedProps.r2 || '';
            document.getElementById('sel-ruta').value = ex.extendedProps.ruta || '';
            document.getElementById('obs').value = ex.extendedProps.obs || '';
        } else {
            selT(null);
            document.querySelectorAll('#form-dia input, #form-dia textarea').forEach(i => i.value = '');
            document.getElementById('sel-ruta').value = '';
        }
    }

    function selT(t) {
        currT = t;
        document.querySelectorAll('.btn-turno').forEach(b => b.classList.remove('selected'));
        if(t) document.getElementById('b-'+t).classList.add('selected');
    }

    function guardar() {
        if(!currT) return alert("Selecciona DÍA, NOCHE o FUERA");
        datos = datos.filter(e => e.start !== currF);
        const col = {dia:'var(--dia-color)', noche:'var(--noche-color)', fuera:'var(--fuera-color)'};
        const txt = {dia:'☀️ DÍA', noche:'🌙 NOCHE', fuera:'🏨 FUERA'};
        datos.push({
            title: txt[currT], start: currF, backgroundColor: col[currT], borderColor: 'black',
            extendedProps: {
                tipo: currT, ruta: document.getElementById('sel-ruta').value,
                t1: document.getElementById('t1').value.toUpperCase(), t2: document.getElementById('t2').value.toUpperCase(),
                r1: document.getElementById('r1').value.toUpperCase(), r2: document.getElementById('r2').value.toUpperCase(),
                obs: document.getElementById('obs').value
            }
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
        cal.removeAllEvents(); cal.addEventSource(datos);
        document.getElementById('form-dia').style.display = 'none';
        cal.render();
        actualizarTodo();
    }

    function borrar() {
        datos = datos.filter(e => e.start !== currF);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
        cal.removeAllEvents(); cal.addEventSource(datos);
        document.getElementById('form-dia').style.display = 'none';
        cal.render();
        actualizarTodo();
    }

    // --- COPIA DE SEGURIDAD TOTAL ---
    function exportar() {
        const fullBackup = {
            viajes: datos,
            rutas: misRutas,
            timestamp: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(fullBackup)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `COPIA_BITACORA_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function importar(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const json = JSON.parse(e.target.result);
            if(json.viajes) {
                datos = json.viajes;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
            }
            if(json.rutas) {
                misRutas = json.rutas;
                localStorage.setItem(RUTAS_KEY, JSON.stringify(misRutas));
            }
            location.reload();
        };
        reader.readAsText(event.target.files[0]);
    }

    // --- RUTAS ---
    function addRutaLista() {
        const val = document.getElementById('nueva-ruta-input').value;
        if(!val) return;
        misRutas.push(val);
        localStorage.setItem(RUTAS_KEY, JSON.stringify(misRutas));
        document.getElementById('nueva-ruta-input').value = '';
        pintarRutasConfig(); actualizarSelectRutas();
    }
    function pintarRutasConfig() {
        document.getElementById('lista-rutas-config').innerHTML = misRutas.map((r, i) => `
            <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                <span>${r}</span><button onclick="eliminarRuta(${i})" style="color:red; border:none; background:none;">X</button>
            </div>`).join('');
    }
    function eliminarRuta(idx) {
        misRutas.splice(idx, 1);
        localStorage.setItem(RUTAS_KEY, JSON.stringify(misRutas));
        pintarRutasConfig(); actualizarSelectRutas();
    }
    function actualizarSelectRutas() {
        document.getElementById('sel-ruta').innerHTML = '<option value="">-- Elige --</option>' + 
            misRutas.map(r => `<option value="${r}">${r}</option>`).join('');
    }

    function pintarHistorialPorMeses() {
        const cont = document.getElementById('historial-lista');
        cont.innerHTML = '';
        if(datos.length === 0) { cont.innerHTML = '<p style="text-align:center;color:#999">Vacio.</p>'; return; }
        const datosOrdenados = [...datos].sort((a,b) => new Date(b.start) - new Date(a.start));
        let ultimoMesNomina = "";
        datosOrdenados.forEach(e => {
            const fecha = new Date(e.start);
            let mesN = (fecha.getDate() > 25) ? fecha.getMonth() + 1 : fecha.getMonth();
            let añoN = fecha.getFullYear(); if(mesN > 11) { mesN = 0; añoN++; }
            const nombreM = new Intl.DateTimeFormat('es', { month: 'long' }).format(new Date(añoN, mesN));
            const idM = `${nombreM} ${añoN}`;
            if(idM !== ultimoMesNomina) {
                ultimoMesNomina = idM;
                cont.innerHTML += `<div class="mes-separador">NÓMINA ${idM.toUpperCase()}</div>`;
            }
            const p = e.extendedProps;
            let obsHtml = p.obs ? `<div class="obs-box"><b>Nota:</b> ${p.obs}</div>` : '';
            cont.innerHTML += `<div class="card">
                <div class="card-header"><span>📅 ${e.start}</span> <span style="color:${e.backgroundColor}">${e.title}</span></div>
                <div style="font-weight:bold; color:var(--domingo-color)">📍 ${p.ruta || '-'}</div>
                <div style="font-size:11px; color:#666; margin-top:4px;">${p.t1||''} ${p.t2||''} | ${p.r1||''} ${p.r2||''}</div>
                ${obsHtml}
            </div>`;
        });
    }

    function actualizarTodo() {
        if(!cal) return;
        const v = cal.getDate();
        const ini = new Date(v.getFullYear(), v.getMonth() - 1, 26);
        const fin = new Date(v.getFullYear(), v.getMonth(), 25, 23, 59);
        const opt = { day: 'numeric', month: 'short' };
        document.getElementById('rango-f').innerText = `Periodo: ${ini.toLocaleDateString('es', opt)} al ${fin.toLocaleDateString('es', opt)}`;
        const lista = datos.filter(e => { const f = new Date(e.start); return f>=ini && f<=fin; });
        document.getElementById('c-dia').innerText = lista.filter(e=>e.extendedProps.tipo==='dia').length;
        document.getElementById('c-noche').innerText = lista.filter(e=>e.extendedProps.tipo==='noche').length;
        document.getElementById('c-fuera').innerText = lista.filter(e=>e.extendedProps.tipo==='fuera').length;
        const doms = lista.filter(e => {
            const fe = new Date(e.start);
            return fe.getDay()===0 && (e.extendedProps.tipo==='dia'||e.extendedProps.tipo==='noche');
        }).length;
        document.getElementById('c-euros').innerText = doms * 50;
    }
</script>
</body>
</html>
