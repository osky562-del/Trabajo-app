<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Trabajo</title>

<style>

body{
font-family:Arial;
background:#0C1219;
color:white;
text-align:center;
padding:15px;
}

button,input,textarea,select{
width:90%;
padding:10px;
margin:6px;
border-radius:8px;
border:none;
}

button{
background:#1E90FF;
color:white;
font-weight:bold;
}

.delete{
background:#e74c3c;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
margin-top:20px;
}

.day{
padding:12px;
border-radius:6px;
background:#162030;
cursor:pointer;
}

.selected{
outline:3px solid white;
}

</style>
</head>

<body>

<h2>🚛 Control Trabajo</h2>

<div>
<button onclick="mesAnterior()">◀</button>
<span id="mesTexto"></span>
<button onclick="mesSiguiente()">▶</button>
</div>

<div id="calendar" class="calendar"></div>

<h3>Día seleccionado: <span id="fechaTexto">ninguno</span></h3>

<select id="tipo">
<option value="dia">Trabajo de día</option>
<option value="noche">Trabajo de noche</option>
</select>

<label>
<input type="checkbox" id="dormirFuera">
Dormir fuera
</label>

<textarea id="camionA" placeholder="Camión A"></textarea>
<textarea id="plataformaA" placeholder="Plataforma A"></textarea>

<textarea id="camionB" placeholder="Camión B (opcional)"></textarea>
<textarea id="plataformaB" placeholder="Plataforma B (opcional)"></textarea>

<textarea id="ruta" placeholder="Ruta"></textarea>

<input id="salida" type="time">
<input id="llegada" type="time">

<button onclick="guardar()">Guardar día</button>
<button class="delete" onclick="borrar()">🗑 Borrar día</button>

<script>

let data = JSON.parse(localStorage.getItem("trabajoData") || "{}")

let fechaSeleccionada = null
let fechaActual = new Date()

function formatearFecha(year,month,day){

month = month + 1

if(month < 10) month = "0"+month
if(day < 10) day = "0"+day

return year+"-"+month+"-"+day

}

function guardar(){

if(!fechaSeleccionada){
alert("Selecciona un día del calendario")
return
}

let registro = {

tipo: document.getElementById("tipo").value,
dormirFuera: document.getElementById("dormirFuera").checked,

camionA: document.getElementById("camionA").value,
plataformaA: document.getElementById("plataformaA").value,

camionB: document.getElementById("camionB").value,
plataformaB: document.getElementById("plataformaB").value,

ruta: document.getElementById("ruta").value,

salida: document.getElementById("salida").value,
llegada: document.getElementById("llegada").value

}

data[fechaSeleccionada] = registro

localStorage.setItem("trabajoData", JSON.stringify(data))

alert("Guardado")

}

function borrar(){

if(!fechaSeleccionada){
alert("Selecciona un día")
return
}

delete data[fechaSeleccionada]

localStorage.setItem("trabajoData", JSON.stringify(data))

alert("Día borrado")

seleccionarDia(fechaSeleccionada)

}

function seleccionarDia(fecha){

fechaSeleccionada = fecha

document.getElementById("fechaTexto").innerText = fecha

let info = data[fecha] || {}

document.getElementById("tipo").value = info.tipo || "dia"
document.getElementById("dormirFuera").checked = info.dormirFuera || false

document.getElementById("camionA").value = info.camionA || ""
document.getElementById("plataformaA").value = info.plataformaA || ""

document.getElementById("camionB").value = info.camionB || ""
document.getElementById("plataformaB").value = info.plataformaB || ""

document.getElementById("ruta").value = info.ruta || ""

document.getElementById("salida").value = info.salida || ""
document.getElementById("llegada").value = info.llegada || ""

renderCalendar()

}

function renderCalendar(){

let calendar = document.getElementById("calendar")
calendar.innerHTML = ""

let year = fechaActual.getFullYear()
let month = fechaActual.getMonth()

document.getElementById("mesTexto").innerText = (month+1)+" / "+year

let firstDay = new Date(year,month,1).getDay()
let daysInMonth = new Date(year,month+1,0).getDate()

for(let i=0;i<firstDay;i++){
calendar.innerHTML += "<div></div>"
}

for(let d=1; d<=daysInMonth; d++){

let fecha = formatearFecha(year,month,d)

let clase = "day"

if(fecha === fechaSeleccionada){
clase += " selected"
}

calendar.innerHTML += "<div class='"+clase+"' onclick=\"seleccionarDia('"+fecha+"')\">"+d+"</div>"

}

}

function mesAnterior(){

fechaActual.setMonth(fechaActual.getMonth()-1)
renderCalendar()

}

function mesSiguiente(){

fechaActual.setMonth(fechaActual.getMonth()+1)
renderCalendar()

}

renderCalendar()

</script>

</body>
</html>
