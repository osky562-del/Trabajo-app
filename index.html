<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registro de Trabajo</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

h1{
margin-top:20px;
}

#calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
max-width:500px;
margin:auto;
}

.day{
padding:15px;
background:#222;
cursor:pointer;
border-radius:8px;
}

.day:hover{
background:#333;
}

.trabajoDia{
background:green;
}

.trabajoNoche{
background:red;
}

.dormir{
background:orange;
}

#panel{
margin-top:20px;
}

input,select{
margin:5px;
padding:8px;
width:200px;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:5px;
cursor:pointer;
}

.save{
background:#28a745;
color:white;
}

.delete{
background:#dc3545;
color:white;
}

#summary{
margin-top:20px;
}

.legend{
margin-top:20px;
}

.box{
display:inline-block;
width:15px;
height:15px;
margin-right:5px;
}

.green{background:green;}
.red{background:red;}
.orange{background:orange;}

</style>
</head>

<body>

<h1>Registro de Trabajo</h1>

<select id="month"></select>
<select id="year"></select>

<div id="calendar"></div>

<div id="panel">

<h3>Día seleccionado: <span id="selectedDay"></span></h3>

<select id="tipo">
<option value="">Tipo trabajo</option>
<option value="dia">Trabajo de día</option>
<option value="noche">Trabajo de noche</option>
<option value="dormir">Dormir fuera</option>
</select>

<br>

<input id="camion1" placeholder="Camión 1">

<input id="plataforma1" placeholder="Plataforma 1">

<br>

<input id="camion2" placeholder="Camión 2 (opcional)">

<input id="plataforma2" placeholder="Plataforma 2 (opcional)">

<br>

<input id="ruta" placeholder="Ruta">

<br>

<input id="salida" placeholder="Hora salida">

<input id="llegada" placeholder="Hora llegada">

<br>

<button class="save" onclick="guardar()">Guardar día</button>

<button class="delete" onclick="borrar()">Borrar día</button>

</div>

<div id="summary">

<h3>Resumen</h3>

<p>Días trabajados mes: <span id="mes"></span></p>

<p>Días trabajados año: <span id="anio"></span></p>

</div>

<div class="legend">

<h3>Leyenda</h3>

<div><span class="box green"></span>Trabajo de día</div>

<div><span class="box red"></span>Trabajo de noche</div>

<div><span class="box orange"></span>Dormir fuera</div>

</div>

<script>

let selected=null

let data=JSON.parse(localStorage.getItem("trabajo"))||{}

let calendar=document.getElementById("calendar")

let monthSelect=document.getElementById("month")

let yearSelect=document.getElementById("year")

let months=[
"Enero","Febrero","Marzo","Abril","Mayo","Junio",
"Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
]

months.forEach((m,i)=>{
let op=document.createElement("option")
op.value=i
op.text=m
monthSelect.appendChild(op)
})

for(let y=2024;y<=2035;y++){
let op=document.createElement("option")
op.value=y
op.text=y
yearSelect.appendChild(op)
}

monthSelect.value=new Date().getMonth()
yearSelect.value=new Date().getFullYear()

monthSelect.onchange=draw
yearSelect.onchange=draw

function draw(){

calendar.innerHTML=""

let m=parseInt(monthSelect.value)
let y=parseInt(yearSelect.value)

let days=new Date(y,m+1,0).getDate()

for(let d=1;d<=days;d++){

let div=document.createElement("div")
div.className="day"
div.innerText=d

let key=y+"-"+m+"-"+d

if(data[key]){

if(data[key].tipo=="dia") div.classList.add("trabajoDia")
if(data[key].tipo=="noche") div.classList.add("trabajoNoche")
if(data[key].tipo=="dormir") div.classList.add("dormir")

}

div.onclick=()=>selectDay(d)

calendar.appendChild(div)

}

resumen()

}

function selectDay(d){

selected=d

document.getElementById("selectedDay").innerText=d

}

function guardar(){

if(!selected)return alert("Selecciona un día")

let m=parseInt(monthSelect.value)
let y=parseInt(yearSelect.value)

let key=y+"-"+m+"-"+selected

data[key]={

tipo:document.getElementById("tipo").value,

camion1:document.getElementById("camion1").value,
plataforma1:document.getElementById("plataforma1").value,

camion2:document.getElementById("camion2").value,
plataforma2:document.getElementById("plataforma2").value,

ruta:document.getElementById("ruta").value,

salida:document.getElementById("salida").value,

llegada:document.getElementById("llegada").value

}

localStorage.setItem("trabajo",JSON.stringify(data))

draw()

}

function borrar(){

if(!selected)return

let m=parseInt(monthSelect.value)
let y=parseInt(yearSelect.value)

let key=y+"-"+m+"-"+selected

delete data[key]

localStorage.setItem("trabajo",JSON.stringify(data))

draw()

}

function resumen(){

let m=parseInt(monthSelect.value)
let y=parseInt(yearSelect.value)

let mes=0
let anio=0

for(let k in data){

let parts=k.split("-")

if(parts[0]==y && parts[1]==m) mes++

if(parts[0]==y) anio++

}

document.getElementById("mes").innerText=mes
document.getElementById("anio").innerText=anio

}

draw()

</script>

</body>
</html>
