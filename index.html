<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora Furgo-Trayler NUBE</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    
    <style>
        :root { --dia-color: #FFD700; --noche-color: #4B0082; --fuera-color: #FF4500; --domingo-color: #27ae60; --accent: #2c3e50; --bg: #f4f4f9; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); padding-bottom: 80px; }
        #app { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; }
        header { padding: 10px; text-align: center; border-bottom: 1px solid #ddd; height: 60px; display: flex; justify-content: center; align-items: center; }
        .tab-content { display: none; padding: 10px; }
        .tab-content.active { display: block; }
        .panel-dietas { background: #e8f5e9; padding: 12px; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        .stats { display: flex; justify-content: space-around; font-weight: bold; }
        .dot-obs { height: 8px; width: 8px; background: #e30613; border-radius: 50%; position: absolute; top: 4px; right: 4px; border: 1px solid white; }
        .form-contenedor { background: #fff; border: 2px solid var(--accent); border-radius: 12px; padding: 15px; margin-top: 10px; display: none; scroll-margin-top: 80px; }
        input, select, textarea { padding: 12px; border: 1px solid #ccc; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; }
        .nav-btn { background: none; border: none; color: #999; font-size: 10px; font-weight: bold; }
        .nav-btn.active { color: var(--accent); }
        .btn-turno { border: none; padding: 12px; border-radius: 6px; color: white; font-weight: bold; opacity: 0.3; flex: 1; }
        .btn-turno.selected { opacity: 1; border: 2px solid black; }
        .btn-guardar { background: var(--domingo-color); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div id="app">
    <header><div style="font-weight: 900; color: #e30613; font-size: 22px;">FURGO<span style="color: #4d4d4d;">TRAYLER</span> ☁️</div></header>

    <div id="tab-cal" class="tab-content active">
        <div class="panel-dietas">
            <div id="rango-f" style="font-size:11px; color:#666"></div>
            <div class="stats">
                <span>☀️ <span id="c-dia">0</span></span>
                <span>🌙 <span id="c-noche">0</span></span>
                <span>🏨 <span id="c-fuera">0</span></span>
                <span style="color:var(--domingo-color)">€ <span id="c-euros">0</span></span>
            </div>
        </div>
        <div id="calendar"></div>
        <div id="form-dia" class="form-contenedor">
            <b id="fecha-label"></b>
            <div style="display:flex; gap:5px; margin: 15px 0;">
                <button id="b-dia" class="btn-turno" style="background:var(--dia-color);color:black" onclick="selT('dia')">DÍA</button>
                <button id="b-noche" class="btn-turno" style="background:var(--noche-color)" onclick="selT('noche')">NOCHE</button>
                <button id="b-fuera" class="btn-turno" style="background:var(--fuera-color)" onclick="selT('fuera')">FUERA</button>
            </div>
            <select id="sel-ruta"></select>
            <input type="text" id="obs" placeholder="Observaciones...">
            <button class="btn-guardar" onclick="guardarNube()">GUARDAR EN LA NUBE</button>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="nav('cal')">📅<br>CALENDARIO</button>
        <button class="nav-btn" onclick="nav('conf')">⚙️<br>RUTAS</button>
    </nav>
</div>

<script>
    // --- AQUÍ PEGA TUS LLAVES DE FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyDXnKRYZ_1BLKEK9T50d85Gzzf3so2DDbM",
        databaseURL: "https://mi-cuadrante-furgo-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "mi-cuadrante-furgo"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let cal, currF, currT, datos = [], misRutas = ['Ruta Local', 'Base-Base'];

    document.addEventListener('DOMContentLoaded', () => {
        cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth', locale: 'es', firstDay: 1, height: 'auto',
            headerToolbar: { left: 'prev,next', center: 'title', right: '' },
            dateClick: (i) => { currF = i.dateStr; mostrarForm(i.dateStr); },
            datesSet: actualizarTodo,
            dayCellDidMount: (info) => {
                const item = datos.find(d => d.start === info.date.toLocaleDateString('en-CA'));
                if (item?.extendedProps?.obs) {
                    const dot = document.createElement('span'); dot.className = 'dot-obs';
                    info.el.querySelector('.fc-daygrid-day-top').appendChild(dot);
                }
            }
        });
        cal.render();
        cargarDeNube();
    });

    function cargarDeNube() {
        // Cargar Viajes
        db.ref('viajes').on('value', (snap) => {
            const val = snap.val();
            datos = val ? Object.values(val) : [];
            cal.removeAllEvents();
            cal.addEventSource(datos);
            actualizarTodo();
        });
        // Cargar Rutas
        db.ref('rutas_config').on('value', (snap) => {
            if(snap.val()) {
                misRutas = snap.val();
                actualizarSelectRutas();
            }
        });
    }

    function guardarNube() {
        if(!currT) return alert("Elige turno");
        const registro = {
            title: currT === 'dia' ? '☀️ DÍA' : (currT === 'noche' ? '🌙 NOCHE' : '🏨 FUERA'),
            start: currF,
            backgroundColor: currT === 'dia' ? 'var(--dia-color)' : (currT === 'noche' ? 'var(--noche-color)' : 'var(--fuera-color)'),
            extendedProps: { tipo: currT, ruta: document.getElementById('sel-ruta').value, obs: document.getElementById('obs').value }
        };
        db.ref('viajes/' + currF).set(registro);
        document.getElementById('form-dia').style.display = 'none';
    }

    function mostrarForm(f) {
        document.getElementById('form-dia').style.display = 'block';
        document.getElementById('fecha-label').innerText = f;
        setTimeout(() => { document.getElementById('form-dia').scrollIntoView({behavior:'smooth'}); }, 100);
    }

    function selT(t) { currT = t; document.querySelectorAll('.btn-turno').forEach(b => b.classList.remove('selected')); document.getElementById('b-'+t).classList.add('selected'); }
    
    function actualizarSelectRutas() {
        document.getElementById('sel-ruta').innerHTML = misRutas.map(r => `<option value="${r}">${r}</option>`).join('');
    }

    function actualizarTodo() {
        if(!cal) return;
        const v = cal.getDate();
        const ini = new Date(v.getFullYear(), v.getMonth() - 1, 26);
        const fin = new Date(v.getFullYear(), v.getMonth(), 25, 23, 59);
        const lista = datos.filter(e => { const f = new Date(e.start); return f>=ini && f<=fin; });
        document.getElementById('c-dia').innerText = lista.filter(e=>e.extendedProps.tipo==='dia').length;
        document.getElementById('c-noche').innerText = lista.filter(e=>e.extendedProps.tipo==='noche').length;
        document.getElementById('c-fuera').innerText = lista.filter(e=>e.extendedProps.tipo==='fuera').length;
        const doms = lista.filter(e => { const fe = new Date(e.start); return fe.getDay()===0 && (e.extendedProps.tipo==='dia'||e.extendedProps.tipo==='noche'); }).length;
        document.getElementById('c-euros').innerText = doms * 50;
    }

    function nav(t) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
    }
</script>
</body>
</html>
